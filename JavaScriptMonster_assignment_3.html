<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Monster Detail</title>

    <style>
      body {
        font-family: "Times New Roman", serif;
        margin: 20px;
      }

      h3 {
        margin-bottom: 10px;
      }

      #monster-list {
        font-family: "Times New Roman", serif;
        font-size: 14px;
      }

      hr {
        margin: 15px 0;
      }

      table {
        margin-top: 5px;
      }

      th,
      td {
        border: none;             
        padding: 3px 10px 3px 0;  
      }

      th {
        font-weight: bold; 
      }
    </style>
  </head>

  <body>
    <h3>Monster Detail</h3>

    <div>Select Monster:</div>
    <div>
      <select id="monster-list"></select>
    </div>

    <hr />

    <div>
      <table>
        <tr>
          <th>ID</th>
          <td id="td-monster-id"></td>
        </tr>
        <tr>
          <th>Name</th>
          <td id="td-monster-name"></td>
        </tr>
        <tr>
          <th>HP</th>
          <td id="td-monster-hp"></td>
        </tr>
        <tr>
          <th>EXP</th>
          <td id="td-monster-exp"></td>
        </tr>
      </table>
    </div>

    <script>
    
      const monsters = [
        { id: 1, name: "Fire Dragon", hp: 150, exp: 85 },
        { id: 2, name: "Ice Wolf", hp: 75, exp: 45 },
        { id: 3, name: "Shadow Goblin", hp: 40, exp: 25 },
        { id: 4, name: "Lightning Phoenix", hp: 200, exp: 120 },
        { id: 5, name: "Earth Golem", hp: 180, exp: 95 },
        { id: 6, name: "Poison Spider", hp: 60, exp: 35 },
        { id: 7, name: "Wind Eagle", hp: 90, exp: 55 },
        { id: 8, name: "Dark Skeleton", hp: 65, exp: 40 },
        { id: 9, name: "Crystal Unicorn", hp: 120, exp: 75 },
        { id: 10, name: "Lava Titan", hp: 250, exp: 150 },
      ];

      const monsterSelect = document.getElementById("monster-list");
      const tdId = document.getElementById("td-monster-id");
      const tdName = document.getElementById("td-monster-name");
      const tdHp = document.getElementById("td-monster-hp");
      const tdExp = document.getElementById("td-monster-exp");

      function initMonsterSelect() {
        const defaultOption = document.createElement("option");
        defaultOption.value = "";
        defaultOption.textContent = "-";
        monsterSelect.appendChild(defaultOption);

        monsters.forEach((monster) => {
          const opt = document.createElement("option");
          opt.value = monster.id;
          opt.textContent = monster.name;
          monsterSelect.appendChild(opt);
        });
      }

      function clearMonsterDetail() {
        tdId.textContent = "";
        tdName.textContent = "";
        tdHp.textContent = "";
        tdExp.textContent = "";
      }

      function handleMonsterChange() {
        const selectedId = Number(monsterSelect.value);

        if (!selectedId) {
          clearMonsterDetail();
          return;
        }

        const monster = monsters.find((m) => m.id === selectedId);
        if (!monster) {
          clearMonsterDetail();
          return;
        }

        tdId.textContent = monster.id;
        tdName.textContent = monster.name;
        tdHp.textContent = monster.hp;
        tdExp.textContent = monster.exp;
      }

      initMonsterSelect();
      clearMonsterDetail();
      monsterSelect.addEventListener("change", handleMonsterChange);
    </script>
  </body>
</html>
